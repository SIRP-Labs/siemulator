name: pages

# Publishes the docs site to GitHub Pages so the ingestion guide is
# findable from a web search, not only by someone already on the repo.
# The same markdown is served three ways from one source:
#   github.com            docs/ingestion-guide.md (canonical)
#   the live host         /guide (packaged copy, pinned identical)
#   this site             sirp-labs.github.io/siemulator

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install mkdocs-material==9.5.49

      # --strict turns broken internal links and nav references into build
      # failures, so a renamed doc can't silently ship a 404.
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
